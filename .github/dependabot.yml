# Dependabot version updates for the dsh-tool-ultra monorepo.
#
# - npm at / covers the root package and workspaces under packages/*.
# - examples/ and test/ package.json directories sit outside workspaces, so they are listed separately.
# - sidecar is a Rust crate (Cargo.toml + Cargo.lock), not a Node package, so it uses the cargo ecosystem.
# - Groups collapse minor/patch updates by dependency type (or all Actions together) to reduce PR noise.
# - Majors stay ungrouped so they can be reviewed one at a time.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/example-classifier
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/example-filter
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /test/testkit
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /test/testkit-devices
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /test/testkit-swiftnest
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /test/trial/driver
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /packages/dsh-tool-ultra-core/sidecar
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
