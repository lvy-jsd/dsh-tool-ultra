# @lvy-jsd/dsh-tool-ultra-pack-control bundle patch: one loader entry.
- insert:
    - id: tool-ultra-pack-control
      name: '@lvy-jsd/dsh-tool-ultra-pack-control'
      config:
        # Which packs are on. ssh is read-only; ssh-exec runs commands and writes files.
        packs:
          ssh: true
          ssh-exec: false
          adb: false
          adb-root: false
          desktop: false
          browser: false
        # true: register only the read-only tools, whatever packs says.
        readOnly: false
        # Tools to leave out, by name (e.g. [ssh_put]).
        disable: []
        # Hosts a model may name. Authentication is by key or agent only (no
        # passwords); `target` is user@host or a Host alias from ~/.ssh/config.
        hosts: {}
        #  nix: { target: 'root@host.example' }
        #  box: { target: 'root@box.example', port: 2222, identity: '/root/.ssh/id_ed25519' }
        #  example-desktop: { target: 'user@desktop.example' }
        # Root SSH automatically selects an active graphical user and drops to
        # that UID. With several active users, select desktop.user per host:
        # desktop: { user: example-user, backend: x11, env: { DISPLAY: ':0' } }
        # Successful sessions are cached per host for 3 seconds; 0 disables it.
        # desktopCacheMs: 3000
        # See README for Wayland session/IPC and existing ydotool socket overrides.
        # Browser CDP on remote loopback (never started automatically):
        # hosts entries may include browser: { port: 9222 }
        # browserAllowPrivate: false
        # browser_eval always asks, even when allow matches.
        # Android aliases -> wireless endpoint or serial. Pair beforehand using
        # adb pair as needed; only these targets are connected/listed/selected.
        serials: {}
        #  example-phone: 'phone.example:5555'
        #  example-usb: 'example-serial'
        # adbConnect: true
        # adbAskInput: false
        # adbUiTtlMs: 30000
        # outputDir: /path/to/screenshots
        # Calls that skip the approval question, per session id ("*" = every
        # session). Leave empty: a session with nobody to ask is refused.
        allow: {}
        # JSON-lines record of every call. '' turns it off. Default:
        # <DSH_HOME>/tool-manager/control-audit.jsonl
        # auditFile: ''
        # ssh_get saves into, and ssh_put reads from, this folder (file names only).
        # transferDir: ~/dsh-transfers
        # Extra remote path patterns (regular expressions) the read tools refuse,
        # on top of /etc/shadow, SSH private keys and /proc/*/environ.
        # denyPaths: []
